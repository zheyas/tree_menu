
<ul>
  {% for node in tree %}
    <li>
      <a href="{{ node.item.get_url }}"
         {% if node.active_path %}style="color:magenta"{% endif %}>
         {{ node.item.title }}
      </a>
      {% if node.children and node.show_children %}
        {% include "tree_menu/menu.html" with tree=node.children %}
      {% endif %}
    </li>
  {% endfor %}
</ul>
