
<ul class="list-unstyled ms-1">
  {% for node in tree %}
    <li>
      <a href="{{ node.item.get_url }}"
         class="nav-link {% if node.active %}active{% endif %}">
          {{ node.item.title }}
      </a>
      {% if node.show_children and node.children %}
        {% include "tree_menu/menu.html" with tree=node.children %}
      {% endif %}
    </li>
  {% endfor %}
</ul>
