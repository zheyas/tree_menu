
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Страница{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { padding-top: 30px; }
        .menu { margin-bottom: 32px; }
        .content { min-height: 300px; }
        hr { margin: 32px 0 12px 0; }
        .tree-menu a.active, .tree-menu a[style*="font-weight:bold"] { color: #d63384 !important; font-weight: bold; }
        .tree-menu ul { padding-left: 18px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="container">
    {% block menu %}
        <!-- Меню вставляется из дочернего шаблона -->
    {% endblock %}
    <hr>
    <div class="content py-2">
        {% block content %}
        {% endblock %}
    </div>
</div>
</body>
</html>
